
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Card Game</title>
<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
padding: 25px 15px;
display: flex;
justify-content: center;
align-items: center;
font-family: Arial, sans-serif;
color: #fffaf0;
background: radial-gradient(circle at top, #285943, #102B22 75%);
}

.game {
width: 100%;
max-width: 750px;
text-align: center;
}

.eyebrow {
color: #e7c77c;
letter-spacing: 3px;
font-size: 11px;
font-weight: bold;
}

h1 {
margin-bottom: 5px;
font-family: Georgia, serif;
font-size: clamp(45px, 10vw, 70px);
letter-spacing: 5px;
}

h1 span {
color: #e7c77c;
}

.subtitle {
color: #c0d7c9;
margin-bottom: 30px;
}

.scores {
display: grid;
grid-template-columns: 1fr 0.7fr 1fr;
gap: 10px;
margin-bottom: 30px;
}

.score {
padding: 15px 5px;
background: #ffffff10;
border: 1px solid #ffffff25;
border-radius: 12px;
}

.score small {
font-size: 10px;
letter-spacing: 1px;
}

.score strong {
display: block;
margin-top: 8px;
color: #FFFFFF;
font-size: 30px;
}

.battle {
display: grid;
grid-template-columns: 1fr 40px 1fr;
gap: 10px;
align-items: center;
}

.player h2 {
font-size: 18px;
}

.card-slot {
min-height: 180px;
display: flex;
justify-content: center;
align-items: center;
}

.card {
width: 120px;
height: 170px;
padding: 10px;
display: flex;
flex-direction: column;
justify-content: space-between;
background: #fffaf0;
color: #171717;
border: 3px solid #e7dcc7;
border-radius: 12px;
box-shadow: 0 10px 25px #0005;
animation: deal 0.25s ease-out;
}

.corner {
display: flex;
flex-direction: column;
align-items: flex-start;
font-size: 22px;
font-weight: bold;
line-height: 1.1;
}

.corner small {
font-size: 20px;
}

.bottom {
align-self: flex-end;
transform: rotate(180deg);
}

.center {
font-size: 43px;
}

.red {
color: #cc3047;
}

.black {
color: #171717;
}

.back {
justify-content: center;
align-items: center;
gap: 15px;
color: #F5F2E9;
background: #416A91;
border: 4px solid #F5F2E9;
outline: 2px solid #416A91;
outline-offset: -10px;
}

.back span {
font-size: 55px;
}

.back small {
letter-spacing: 4px;
font-weight: bold;
}

.vs {
color: #FFFFFF;
font-size: 20px;
font-weight: bold;
}

.card-label {
min-height: 20px;
color: #c0d7c9;
font-size: 12px;
}

.result {
margin: 25px 0;
padding: 20px 12px;
background: #00000025;
border: 1px solid #e7c77c40;
border-radius: 12px;
min-height: 100px;
}

.result h2 {
margin-top: 0;
color: #FFFFFF;
font-size: 20px;
}

.result p {
font-size: 14px;
line-height: 1.5;
}

.buttons {
display: flex;
justify-content: center;
flex-wrap: wrap;
gap: 12px;
}

button {
padding: 14px 24px;
border-radius: 9px;
font-size: 14px;
font-weight: bold;
cursor: pointer;
transition: 0.2s;
}

button:hover:not(:disabled) {
transform: translateY(-2px);
}

button:disabled {
opacity: 0.5;
cursor: not-allowed;
}

#draw {
color: #FFFFFF;
background: #416A91;
border: 1px solid #416A91;
}

#draw:hover:not(:disabled) {
background: #345777;
}

#restart {
color: #FFFFFF;
background: #B84040;
border: 1px solid #B84040;
}

#restart:hover:not(:disabled) {
background: #963333;
}

.hint {
color: #a9c4b5;
font-size: 12px;
margin-top: 22px;
}

@keyframes deal {
from {
opacity: 0;
transform: translateY(10px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

@media (max-width: 450px) {
.battle {
grid-template-columns: 1fr 25px 1fr;
gap: 3px;
}

.card {
width: 100px;
height: 145px;
}

.card-slot {
min-height: 155px;
}

.center {
font-size: 35px;
}

.score small {
font-size: 8px;
}

.score strong {
font-size: 25px;
}
}
</style>
</head>
<body>
<main class="game">
<header>
<p class="eyebrow">CARD GAME</p>
<h1>WAR <span>♠</span></h1>
<p class="subtitle">Beat the computer.</p>
</header>

<section class="scores">
<div class="score">
<small>YOUR CARDS</small>
<strong id="playerCount">26</strong>
</div>
<div class="score">
<small>ROUND</small>
<strong id="roundCount">0</strong>
</div>
<div class="score">
<small>COMPUTER CARDS</small>
<strong id="computerCount">26</strong>
</div>
</section>

<section class="battle">
<div class="player">
<h2>You</h2>
<div class="card-slot" id="playerSlot"></div>
<p class="card-label" id="playerLabel">Your card</p>
</div>

<div class="vs">VS</div>

<div class="player">
<h2>Computer</h2>
<div class="card-slot" id="computerSlot"></div>
<p class="card-label" id="computerLabel">Computer's card</p>
</div>
</section>

<section class="result" aria-live="polite">
<h2 id="resultTitle">Ready to play?</h2>
<p id="resultMessage">Click Draw Cards to start.</p>
</section>

<div class="buttons">
<button id="draw">Draw Cards</button>
<button id="restart">Restart</button>
</div>

<p class="hint">Higher card wins. Ties trigger War.</p>
</main>

<script>
const suits = [
{symbol:"♠",name:"Spades",color:"black"},
{symbol:"♥",name:"Hearts",color:"red"},
{symbol:"♣",name:"Clubs",color:"black"},
{symbol:"♦",name:"Diamonds",color:"red"}
];

const ranks = [
{value:2,label:"2"},
{value:3,label:"3"},
{value:4,label:"4"},
{value:5,label:"5"},
{value:6,label:"6"},
{value:7,label:"7"},
{value:8,label:"8"},
{value:9,label:"9"},
{value:10,label:"10"},
{value:11,label:"J"},
{value:12,label:"Q"},
{value:13,label:"K"},
{value:14,label:"A"}
];

const $ = id => document.getElementById(id);

let playerDeck = [];
let computerDeck = [];
let round = 0;
let gameOver = false;

function createDeck() {
const deck = [];

for (const suit of suits) {
for (const rank of ranks) {
deck.push({
...rank,
suit: suit.symbol,
suitName: suit.name,
color: suit.color
});
}
}

return deck;
}

function shuffle(deck) {
for (let i = deck.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[deck[i], deck[j]] = [deck[j], deck[i]];
}

return deck;
}

function cardBack() {
$("playerSlot").innerHTML =
'<div class="card back"><span>♠</span><small>WAR</small></div>';

$("computerSlot").innerHTML =
'<div class="card back"><span>♠</span><small>WAR</small></div>';
}

function showCard(slotId, card) {
const color = card.color === "red" ? "red" : "black";

$(slotId).innerHTML = `
<div class="card">
<div class="corner ${color}">
<span>${card.label}</span>
<small>${card.suit}</small>
</div>
<div class="center ${color}">${card.suit}</div>
<div class="corner bottom ${color}">
<span>${card.label}</span>
<small>${card.suit}</small>
</div>
</div>`;
}

function updateScores() {
$("playerCount").textContent = playerDeck.length;
$("computerCount").textContent = computerDeck.length;
$("roundCount").textContent = round;
}

function collectCards(deck, pot) {
deck.push(...pot);
shuffle(deck);
}

function prepareWarCard(deck, pot) {
if (deck.length === 0) return null;

for (let i = 0; i < 3 && deck.length > 1; i++) {
pot.push(deck.shift());
}

const card = deck.shift();
pot.push(card);

return card;
}

function endGame() {
if (playerDeck.length === 0 && computerDeck.length === 0) {
gameOver = true;
$("resultTitle").textContent = "It's a draw!";
$("resultMessage").textContent =
"Both players have run out of cards.";
} else if (playerDeck.length === 0) {
gameOver = true;
$("resultTitle").textContent = "Computer wins the game!";
$("resultMessage").textContent =
`The computer wins after ${round} rounds.`;
} else if (computerDeck.length === 0) {
gameOver = true;
$("resultTitle").textContent = "You win the game!";
$("resultMessage").textContent =
`You won after ${round} rounds.`;
}

$("draw").disabled = gameOver;
updateScores();

return gameOver;
}

function playRound() {
if (gameOver || endGame()) return;

round++;

const pot = [];
let playerCard = playerDeck.shift();
let computerCard = computerDeck.shift();

pot.push(playerCard, computerCard);

showCard("playerSlot", playerCard);
showCard("computerSlot", computerCard);

$("playerLabel").textContent =
`${playerCard.label} of ${playerCard.suitName}`;

$("computerLabel").textContent =
`${computerCard.label} of ${computerCard.suitName}`;

let wars = 0;

while (playerCard.value === computerCard.value) {
wars++;

$("resultTitle").textContent = "War!";
$("resultMessage").textContent =
`Tie! War ${wars}. Both players reveal another card.`;

const nextPlayerCard = prepareWarCard(playerDeck, pot);
const nextComputerCard = prepareWarCard(computerDeck, pot);

if (!nextPlayerCard || !nextComputerCard) {
if (!nextPlayerCard && !nextComputerCard) {
if (playerDeck.length > computerDeck.length) {
collectCards(playerDeck, pot);
$("resultTitle").textContent = "You win the round!";
$("resultMessage").textContent =
"Neither player could continue. You had more cards.";
} else if (computerDeck.length > playerDeck.length) {
collectCards(computerDeck, pot);
$("resultTitle").textContent = "You lost the round";
$("resultMessage").textContent =
"Neither player could continue. The computer had more cards.";
} else {
collectCards(playerDeck, pot);
$("resultTitle").textContent = "War ends!";
$("resultMessage").textContent =
"Neither player could continue. The remaining cards go to you.";
}
} else if (!nextPlayerCard) {
collectCards(computerDeck, pot);
$("resultTitle").textContent = "You lost the round";
$("resultMessage").textContent =
"You ran out of cards during War.";
} else {
collectCards(playerDeck, pot);
$("resultTitle").textContent = "You win the round!";
$("resultMessage").textContent =
"The computer ran out of cards during War.";
}

showCard("playerSlot", nextPlayerCard || playerCard);
showCard("computerSlot", nextComputerCard || computerCard);

updateScores();

if (!endGame()) {
$("resultMessage").textContent +=
" Click Draw Cards to continue.";
}

return;
}

playerCard = nextPlayerCard;
computerCard = nextComputerCard;

showCard("playerSlot", playerCard);
showCard("computerSlot", computerCard);

$("playerLabel").textContent =
`${playerCard.label} of ${playerCard.suitName}`;

$("computerLabel").textContent =
`${computerCard.label} of ${computerCard.suitName}`;
}

if (playerCard.value > computerCard.value) {
collectCards(playerDeck, pot);

$("resultTitle").textContent = "You win the round!";
$("resultMessage").textContent =
`Your ${playerCard.label} beats ${computerCard.label}. You collect ${pot.length} cards.`;
} else {
collectCards(computerDeck, pot);

$("resultTitle").textContent = "You lost the round";

$("resultMessage").textContent =
`${computerCard.label} beats your ${playerCard.label}. The computer collects ${pot.length} cards.`;
}

updateScores();
endGame();
}

function restartGame() {
const deck = shuffle(createDeck());

playerDeck = deck.slice(0, 26);
computerDeck = deck.slice(26);

round = 0;
gameOver = false;

cardBack();

$("playerLabel").textContent = "Your card";
$("computerLabel").textContent = "Computer's card";

$("resultTitle").textContent = "Ready to play?";
$("resultMessage").textContent = "Click Draw Cards to start.";

$("draw").disabled = false;

updateScores();
}

$("draw").addEventListener("click", playRound);
$("restart").addEventListener("click", restartGame);

restartGame();
</script>
</body>
</html>
